name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m compileall -q .
      - name: Run application
        run: python app.py
